name: Render PlantUML Diagrams

on:
  push:
    paths:
      - 'diagrams/**'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Download PlantUML jar
        run: |
          wget -q -O plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

      - name: Render Diagrams to PNG
        run: |
          java -jar plantuml.jar -r -tpng -o "../renders" "diagrams/*.puml"

      - name: Commit & Push Rendered Images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add renders/
          if git diff --staged --quiet; then
            echo "No changes in renders to commit."
          else
            git commit -m "[CI] Auto-render PlantUML diagrams to PNG [skip ci]"
            git push
          fi

